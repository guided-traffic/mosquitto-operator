apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mosquitto-operator-leader-election
  namespace: system
# Both the Role and the ServiceAccount are part of this kustomization, so
# kustomize rewrites these two names when config/default applies its namePrefix.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mosquitto-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: mosquitto-operator
    namespace: system
