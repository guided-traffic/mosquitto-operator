# Leader election permissions for the manager. They are deliberately NOT in
# role.yaml: that file is regenerated by controller-gen from the kubebuilder
# markers on the reconciler, and leader election belongs to the manager, so no
# marker produces these rules and anything added there would be overwritten by
# the next `make generate-all`.
#
# This is a namespaced Role rather than a ClusterRole because the Lease named
# mosquitto-operator.mko.gtrfc.com (LeaderElectionID in cmd/main.go) lives in
# the operator's own namespace. The Helm chart grants the same leases access
# through its ClusterRole instead, guarded by leaderElection.enabled.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mosquitto-operator-leader-election
  namespace: system
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # client-go's LeaseLock records a "LeaderElection" Event on the Lease every
  # time leadership is acquired or released. A missing permission here costs
  # only that Event and a log line, not the election itself.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
