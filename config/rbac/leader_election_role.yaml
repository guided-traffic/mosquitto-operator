# Leader election permissions for the manager. They are deliberately NOT in
# role.yaml: that file is regenerated by controller-gen from the kubebuilder
# markers on the reconciler, and leader election belongs to the manager, so no
# marker produces these rules and anything added there would be overwritten by
# the next `make generate-all`.
#
# This is a namespaced Role rather than a ClusterRole because the Lease named
# mosquitto-operator.mko.gtrfc.com (LeaderElectionID in cmd/main.go) lives in
# the operator's own namespace: cmd/main.go sets no LeaderElectionNamespace, so
# controller-runtime takes the in-cluster namespace.
#
# The Helm chart mirrors this rule for rule in its own templates/leader-election.yaml,
# also as a namespaced Role, also gated on leaderElection.enabled. It used to grant
# leases cluster-wide through the ClusterRole instead - two install paths with
# different authority that nobody had decided. test/rbacparity now compares what both
# paths render, keyed on (kind, apiGroup, resource), so a Role and a ClusterRole
# carrying the same verbs no longer read as the same grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mosquitto-operator-leader-election
  namespace: system
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # client-go's LeaseLock records a "LeaderElection" Event on the Lease every
  # time leadership is acquired or released. A missing permission here costs
  # only that Event and a log line, not the election itself.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
