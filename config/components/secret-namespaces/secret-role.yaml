# The Secret grant in one namespace: the verbs the ClusterRole carries in mode
# "all". One copy of this file per namespace; the names assume config/default's
# namePrefix and namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mosquitto-operator-secrets
  namespace: mosquitto
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - get
      - list
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mosquitto-operator-secrets
  namespace: mosquitto
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mosquitto-operator-secrets
subjects:
  - kind: ServiceAccount
    name: mosquitto-operator-mosquitto-operator
    namespace: mosquitto-operator-system
