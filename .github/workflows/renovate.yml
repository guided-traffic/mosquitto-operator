name: Renovate Application
on:
  # Run daily at 02:00 Europe/Berlin. The timezone key is what makes that true:
  # without it GitHub reads the cron expression as UTC.
  schedule:
    - cron: '0 2 * * *'
      timezone: "Europe/Berlin"
  # Deliberately NOT on push to main. Renovate carries prConcurrentLimit: 0 and
  # prHourlyLimit: 0, so one run opens every update it finds at once - fourteen
  # pull requests on 2026-09-01, each queueing a full Test and Release on the
  # self-hosted runners, which serialise. Overnight that is fine and the whole
  # point of the unlimited setting. Triggered by every merge it is not: during
  # active development each merge starts another wave that blocks the pipeline
  # for the work that caused it.
  #
  # The cost of leaving it out is small, because Renovate does not merge in its
  # run: GitHub merges a pull request the moment the checks main requires have
  # passed (platformAutomerge, enabled by the ruleset on main). What waits for
  # this run is a branch that fell behind main and is red or pending -
  # rebaseWhen "auto" rebuilds it on the current main, so a red main fixed
  # during the day does not leave the open pull requests red behind it
  # (docs/adr/0015).
  #
  # Manual trigger, for when a refresh is wanted before 02:00
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug
          - warn
          - error

permissions:
  contents: read

jobs:
  renovate:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      # GitHub App installation token (guided-traffic-automation), scoped to this
      # repository (no owner/repositories given) with all permissions of the app;
      # expires after 1 h and is revoked at the end of the job. Renovate detects
      # the app identity for its PRs and commits itself.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-hosted Renovate
        # Pinned to a commit, like every third-party action (see the comment above
        # the Trivy step in release.yml); Renovate moves digest and comment together.
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: renovate.json
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_AUTODISCOVER: 'true'
          RENOVATE_AUTODISCOVER_FILTER: 'guided-traffic/mosquitto-operator'
          RENOVATE_REQUIRE_CONFIG: 'required'
