name: Renovate Application
on:
  # Run daily at 02:00 Europe/Berlin. The timezone key is what makes that true:
  # without it GitHub reads the cron expression as UTC.
  schedule:
    - cron: '0 2 * * *'
      timezone: "Europe/Berlin"
  # Deliberately NOT on push to main. Renovate carries prConcurrentLimit: 0 and
  # prHourlyLimit: 0, so one run opens every update it finds at once - fourteen
  # pull requests on 2026-09-01, each queueing a full Test and Release on the
  # self-hosted runners, which serialise. Overnight that is fine and the whole
  # point of the unlimited setting. Triggered by every merge it is not: during
  # active development each merge starts another wave that blocks the pipeline
  # for the work that caused it.
  #
  # The cost of leaving it out: after a dependency pull request merges, the
  # remaining open ones are not refreshed until the next nightly run. That is
  # cheap here, because rebaseWhen is "conflicted" - Renovate rebases the ones
  # that actually stopped applying, and the rest were already correct.
  #
  # Manual trigger, for when a refresh is wanted before 02:00
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug
          - warn
          - error

permissions:
  contents: read

jobs:
  renovate:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.5
        with:
          token: ${{ secrets.BOT_PAT }}
          configurationFile: renovate.json
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_AUTODISCOVER: 'true'
          RENOVATE_AUTODISCOVER_FILTER: 'guided-traffic/mosquitto-operator'
          RENOVATE_REQUIRE_CONFIG: 'required'
