apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mosquitto-operator.fullname" . }}
  labels:
    {{- include "mosquitto-operator.labels" . | nindent 4 }}
{{/*
The rules below mirror the kubebuilder RBAC markers on the reconciler in
internal/controller/mosquitto_controller.go, which is what config/rbac/role.yaml
is generated from. Nothing regenerates this template, so a new marker has to be
added here by hand - anything the reconciler writes without a rule here fails
403 on every pass. test/rbacparity (make verify-rbac-parity) renders this chart
and config/default and fails when the two grant different authority.

This ClusterRole holds no leases rule: leader election belongs to the manager,
not to the reconciler, and its rule lives in the namespaced Role of
leader-election.yaml, mirroring config/rbac/leader_election_role.yaml.
*/}}
rules:
  # The Mosquitto resources themselves, their status subresource and their
  # finalizers. The reconciler only reads Mosquitto objects - it never creates,
  # updates or deletes one - so the spec verbs stop at get/list/watch, and the
  # status subresource carries update alone because Status().Update() is a PUT
  # and nothing reads status on its own.
  #
  # No patch anywhere below: nothing in the reconciler patches. list and watch
  # are not direct calls either - they are what the informer cache needs to cache
  # a type at all.
  - apiGroups:
      - mko.gtrfc.com
    resources:
      - mosquittoes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - mko.gtrfc.com
    resources:
      - mosquittoes/status
    verbs:
      - update
  # The owner references the reconciler writes carry blockOwnerDeletion, and the
  # OwnerReferencesPermissionEnforcement admission plugin - off by default, on in
  # some managed distributions - rejects such a reference unless the writer may
  # update the owner's finalizers.
  - apiGroups:
      - mko.gtrfc.com
    resources:
      - mosquittoes/finalizers
    verbs:
      - update
  # The users of the brokers: read, and their status written. The reconciler
  # never writes a MosquittoUser's spec (docs/adr/0006 D9).
  - apiGroups:
      - mko.gtrfc.com
    resources:
      - mosquittousers
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - mko.gtrfc.com
    resources:
      - mosquittousers/status
    verbs:
      - update
  # The ConfigMap holding mosquitto.conf, plus the headless and the client
  # Service, written for every Mosquitto resource. No delete: the objects are
  # owned by the Mosquitto resource, so garbage collection removes them.
  - apiGroups:
      - ""
    resources:
      - configmaps
      - services
    verbs:
      - create
      - get
      - list
      - update
      - watch
  # The broker StatefulSet. Its status is also where .status.readyReplicas comes
  # from, so read access is not optional.
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - create
      - get
      - list
      - update
      - watch
  # Secrets, with secretAccess.mode "all" (the default, accepted by the owner
  # after the risk was stated - docs/adr/0014 D7): get, list and watch read the
  # users' credentials Secrets and wake a pass when one changes (the operator
  # caches them without their data); create and update write <name>-auth, the
  # one rendered Secret per broker. In every namespace of the cluster - which
  # makes a compromised operator a reader and writer of every Secret there,
  # GitOps deploy keys and the SOPS key included. With mode "namespaces" this
  # rule is absent and secret-roles.yaml grants the same verbs per namespace.
  {{- if eq .Values.secretAccess.mode "all" }}
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - get
      - list
      - update
      - watch
  {{- end }}
  # No leader-election rule here on purpose. The Lease lives in the operator's
  # own namespace, so cluster-wide access to every Lease in the cluster is more
  # than the manager needs; leader-election.yaml grants it as a namespaced Role
  # instead, which is also what config/rbac/leader_election_role.yaml does. The
  # two install paths therefore hand out the same authority.
