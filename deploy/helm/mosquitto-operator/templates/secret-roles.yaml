{{- if eq .Values.secretAccess.mode "namespaces" }}
{{- if not .Values.secretAccess.namespaces }}
{{- fail "secretAccess.mode \"namespaces\" needs at least one entry in secretAccess.namespaces" }}
{{- end }}
{{/*
The Secret grant of secretAccess.mode "namespaces" (docs/adr/0014 D7,
docs/adr/0006 D9): the verbs the ClusterRole carries in mode "all", as one Role
and RoleBinding per listed namespace. The operator cannot create these itself -
RBAC's escalation prevention would require it to hold the grant already - so
they are rendered at install time, and the operator gets the same list as
--secret-namespaces and caches Secrets in those namespaces only. A Mosquitto in
any other namespace is refused with reason NamespaceNotGranted.
config/components/secret-namespaces renders the same on the kustomize path.
*/}}
{{- range $namespace := .Values.secretAccess.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mosquitto-operator.fullname" $ }}-secrets
  namespace: {{ $namespace }}
  labels:
    {{- include "mosquitto-operator.labels" $ | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - get
      - list
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mosquitto-operator.fullname" $ }}-secrets
  namespace: {{ $namespace }}
  labels:
    {{- include "mosquitto-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mosquitto-operator.fullname" $ }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "mosquitto-operator.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
